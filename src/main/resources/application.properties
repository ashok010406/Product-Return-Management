# Render / Railway / Heroku-style hosts provide PORT
server.port=${PORT:8080}
# Default = local file database. On a live host set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (PostgreSQL) and it overrides these.
spring.datasource.url=jdbc:h2:file:./data/returnsdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
# Staff login (override with env vars STAFF_USERNAME / STAFF_PASSWORD on the live site)
staff.username=${STAFF_USERNAME:admin}
staff.password=${STAFF_PASSWORD:admin123}
server.servlet.session.timeout=30m
spring.jackson.serialization.write-dates-as-timestamps=false
