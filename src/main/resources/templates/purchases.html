<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Purchases')}"></head>
<body>
<div class="app"><aside th:replace="~{fragments :: side('purchases')}"></aside><div class="content"><main>
<h1>Purchases</h1>
<div class="alert err" th:if="${error}" th:text="${error}"></div>
<form class="card" method="post" th:action="@{/purchases}">
  <select name="customerId" required><option value="">Select customer</option>
    <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}"></option></select>
  <input name="productName" placeholder="Product name" required>
  <input name="price" type="number" step="0.01" placeholder="Price" required>
  <input name="quantity" type="number" min="1" value="1" required>
  <input name="purchaseDate" type="date" required>
  <button>Add Purchase</button>
</form>
<form method="get" action="/purchases" class="inline" style="margin-bottom:14px">
  <input name="q" th:value="${q}" placeholder="Search product or customer"><button>Search</button>
</form>
<table>
  <tr><th>Order ID</th><th>Customer</th><th>Product</th><th>Price</th><th>Qty</th><th>Date</th><th></th></tr>
  <tr th:each="p : ${purchases}">
    <td th:text="${p.id}"></td><td th:text="${p.customer.name}"></td><td th:text="${p.productName}"></td>
    <td th:text="'Rs ' + ${p.price}"></td><td th:text="${p.quantity}"></td><td th:text="${p.purchaseDate}"></td>
    <td><form method="post" th:action="@{/purchases/{id}/delete(id=${p.id})}"><button class="btn-red">Delete</button></form></td>
  </tr>
</table>
</main></div></div>
</body></html>
